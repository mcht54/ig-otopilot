konum: Sapanca
hedef_kitle: >
  Sapanca'da bungalov kiralamak isteyen çiftler ve aileler (balayı, hafta sonu, kış tatili).
  En büyük korkuları kapora dolandırıcılığı, kaçak/belgesiz tesis ve fotoğraftakinden farklı çıkan yer.
ses_tonu: >
  Güven veren, sakin, bilgilendirici; korku satmadan uyarır. Somut adım verir. Fotoğraflar
  temsilidir; belirli bir tesisi övmez veya kötülemez. Rezervasyon/ödeme almadığımızı unutma.
deger_onerisi:
  - Yalnız Bakanlık belgeli bungalovlar listelenir, belge numarası görünür
  - Kapora göndermeden önce belge ve işletme bilgisi nasıl kontrol edilir anlatılır
  - Komisyon yok; tesisle doğrudan telefon/WhatsApp ile görüşülür
anahtar_kelimeler: [sapanca bungalov, güvenilir bungalov, sapanca jakuzili bungalov, sapanca kiralık bungalov, bungalov dolandırıcılığı, belgeli bungalov]
etiketler: ["#sapanca", "#sapancabungalov", "#bungalov", "#sapancagölü", "#bungalovtatili", "#jakuzilibungalov", "#haftasonu", "#balayı", "#sakarya", "#tinyhouse"]
cta: Belgeli bungalovlar profildeki linkte
yasak_ifadeler: [garanti, en ucuz, "%100", rezervasyon yap]
