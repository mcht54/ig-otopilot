konum: Sakarya
hedef_kitle: >
  Düğün, nişan, nikah, kına ve sünnet hazırlığındaki 20-45 yaş gelin ve damat adayları ile anneleri.
  Model, fiyat, teslim süresi ve "nasıl sipariş veririm" merak ederler.
ses_tonu: >
  Sıcak, zarif, heyecan paylaşan. Kısa cümleler. Fiyat yalnız sitedeki gerçek fiyattan yazılır;
  uydurma indirim yok. "Siz" diye hitap edilir.
deger_onerisi:
  - Düğün, nişan, nikah, kına, sünnet için 1.700+ davetiye modeli
  - Basılı davetiyede siparişten önce tasarım taslağı onayınıza gelir
  - Dijital davetiye animasyonlu açılış, LCV, geri sayım ve harita ile tek linkle WhatsApp'tan paylaşılır
  - Sakarya'dan Türkiye'nin her yerine gönderim
anahtar_kelimeler: [davetiye modelleri, düğün davetiyesi, nikah davetiyesi, kına davetiyesi, sünnet davetiyesi, dijital davetiye]
etiketler: ["#davetiye", "#düğündavetiyesi", "#nikahdavetiyesi", "#kınadavetiyesi", "#sünnetdavetiyesi", "#dijitaldavetiye", "#gelinadayı", "#düğünhazırlığı", "#nişandavetiyesi", "#davetiyemodelleri"]
cta: Tüm modeller profildeki linkte
yasak_ifadeler: [garanti, en ucuz, bedava, "%100"]
saat: {reels: "20:00", hikaye: "10:30"}
formatlar: {model_vitrin: 4, dijital_davetiye: 2, siparis_nasil: 1, kampanya: 1}
ses: {gemini: Laomedeia, edge: tr-TR-EmelNeural, ton_en: "warm, joyful and excited"}
muzik: {hava: sicak, tempo: 104, ton: F}
strateji:
  kitle_icgorusu:
    - Düğün/nişan/sünnet hazırlığındaki 20-45 yaş gelin ve damat adayları ile anneleri; bütçe, zaman ve "herkese yetişir mi" stresi yaşıyor
    - Pahalı davetiye korkusu - "güzel model pahalıdır" düşüncesi; fiyat teklif usulüdür, uydurma fiyat ya da indirim yazılmaz, adet ve modele göre teklif alınabileceği söylenir
    - Davetiye seçimi Pinterest/Instagram'da görsel ilhamla başlıyor; model detayı (zarf, mühür, yazı tipi, renk) çok dikkat çekiyor
    - Kim gelecek belli olmaması (LCV) ve uzaktaki misafire ulaştırma en büyük dertlerden
    - Yazım hatası korkusu: isim, tarih, salon yanlış basılır mı
  dikkat_ettikleri: [modelin gerçek fotoğrafı, kâğıt/zarf kalitesi, kaç günde hazır olur, adet ve fiyat, yazım kontrolü, dijital davetiyenin telefonda nasıl açıldığı]
  itirazlar: [dijital davetiye soğuk durur, büyükler kullanamaz, basılı pahalı, kargo gecikir]
  ozellikler:
    - Basılı davetiye 100-1000 adet; fiyat teklif usulü; baskı öncesi yazım kontrolü WhatsApp'tan
    - Kategoriler - düğün, nişan, nikah, kına, sünnet, lüks, şeffaf, mühürlü, kare, minimal ve yeni sezon
    - Dijital davetiye - animasyonlu açılış, müzik, fotoğraf, geri sayım, harita, LCV ile katılım bildirimi, tek linkle WhatsApp'tan paylaşım
    - Dijital davetiye 4 adımda oluşturulur ve yayınlanmadan önce tam haliyle önizlenir
    - Kampanya varken basılı davetiye alana dijital davetiye hediye (yalnız sitede yazdığı sürece söylenir)
  icerik_sutunlari: [model vitrini ve stil seçimi, dijital davetiye nasıl açılır, sipariş ve adet ipuçları, düğün hazırlık takvimi ipuçları, sezon/kampanya]
  kanca_kaliplari: ["Davetiyen telefonda böyle açılsın", "Kaç davetiye bastırmalı? Çoğu kişi bunu yanlış hesaplıyor", "Bu 4 modelden hangisi senin tarzın?", "Düğüne 2 ay kala davetiye için en geç ne zaman?"]
  kacinilacaklar: [olmayan teslim süresi ya da fiyat söylemek, başka firmayı kötülemek, sitede bitmiş kampanyayı anlatmak]
