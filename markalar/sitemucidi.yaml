kod: sitemucidi
ad: Site Mucidi
site: https://www.sitemucidi.com.tr
site_kisa: sitemucidi.com.tr
logo: fontlar/sitemucidi-logo.svg
renk: {ana: "#C60001", koyu: "#0F0D24", vurgu: "#FF8A3D", acik: "#F6F4EF", yazi: "#FFFFFF"}
konum: Sakarya
hedef_kitle: >
  Web sitesi olmayan ya da eski sitesinden memnun olmayan esnaf ve küçük işletmeler
  (kuaför, oto servis, diş kliniği, restoran, emlak, avukat, usta...). Teknikten anlamazlar,
  pahalı ajans ve uzun süreç korkusu vardır.
ses_tonu: >
  Samimi, net, esnafın diliyle. Teknik terim yok; varsa bir cümlede açıklanır. Abartı, sahte
  garanti, "1 numara" iddiası yok. "Siz" diye hitap edilir.
deger_onerisi:
  - 3 dakikada, kod bilmeden, ücretsiz deneyerek web sitesi kurulur
  - 199 hazır tasarım, sektöre göre önerilir
  - WhatsApp butonu, Google Haritalar, randevu/teklif formu gibi özellikler tek tıkla açılır
  - İnsanlar artık ChatGPT/Gemini'ye soruyor; yapay zekâ cevabı web sitelerinden derler. Sitesi olmayan işletme önerilmez
anahtar_kelimeler: [web sitesi kurma, ücretsiz web sitesi, hazır web sitesi, esnaf web sitesi, web sitesi yaptırmak, Google'da çıkmak]
etiketler: ["#websitesi", "#websitesikurma", "#esnaf", "#küçükişletme", "#dijitalpazarlama", "#sakarya", "#hazırsite", "#yapayzeka", "#googledaçıkmak", "#girişimcilik"]
cta: Profildeki linkten ücretsiz dene
yasak_ifadeler: [garanti, "%100", 1 numara, birinci sıra, en ucuz, bedava site]
saat: {reels: "12:30", hikaye: "09:30"}
# format: başlangıç ağırlığı (ölçüm geldikçe otomatik güncellenir)
formatlar: {sektor_demo: 4, ozellik: 2, yz_arama: 2, tema_paket: 1}
# Seslendirme (Gemini TTS sesi, yedek Microsoft sesi) ve fon müziği havası
ses: {gemini: Puck, edge: tr-TR-AhmetNeural, ton_en: "upbeat, enthusiastic and fast-paced"}
muzik: {hava: enerjik, tempo: 122, ton: A}
# İçerik stratejisi: her metin yazımında yapay zekâya verilir (gerçek insan gibi düşünmesi için). Yalnız doğru bilgi.
strateji:
  kitle_icgorusu:
    - Esnaf "web sitesi pahalı, uğraştırır, ajans aylarca oyalar" diye düşünüyor; zamanı yok, teknik bilgisi yok
    - Müşteri Google'da ve haritada arıyor; sitesi olmayan esnaf rakibine kaybettiğini çoğu zaman fark etmiyor
    - Yapay zekâ asistanları (ChatGPT, Gemini) işletme önerirken bilgisi net siteleri öne çıkarıyor
    - Önce kendi sektörüne uygun hazır örneği görmek istiyor; "benim işime uyar mı" sorusu karar verdirir
  dikkat_ettikleri: [kendi sektörüne özel görünüm, ne kadar sürede biter, telefonda nasıl görünür, WhatsApp butonu, Google'da çıkar mı, sonradan kendim değiştirebilir miyim]
  itirazlar: [pahalıdır, kodlama gerekir, sonra bakımını kim yapacak, şablon gibi durur]
  ozellikler:
    - Sektöre hazır temalar; işletme adı yazılınca site o isimle anında önizlenir
    - Sihirbazla 3 dakikada kurulum; oluşturmak ücretsiz, kaydedince 7 gün denenir, yayına almak ücretlidir
    - WhatsApp butonu, harita, online randevu, teklif formu, galeri, müşteri yorumları, SSS
    - Google İşletme bağlantısı, Instagram vitrini, ürün kataloğu, blog, İngilizce ikinci dil, gelişmiş SEO paketi
    - Özellikler sihirbazda tek tıkla açılıp kapanır; fiyat seçilen özelliklere göre anında görünür
  icerik_sutunlari: [sektör sektör 3 dakikada site demosu, esnafın gerçek derdi ve çözümü, yapay zekâ aramasında görünmek, tek özellik tek fayda, tema vitrini]
  kanca_kaliplari: ["[Sektör] sahibiysen bu 3 dakikayı izle", "Müşterin seni Google'da arayınca ne görüyor?", "ChatGPT'ye '[şehir]de [sektör]' yazdık, bakın kimi önerdi", "Ajans 3 hafta dedi, biz 3 dakikada kurduk"]
  kacinilacaklar: [rakip firma adı vermek, kesin Google sıralaması vaadi, gerçek olmayan müşteri hikâyesi, fiyatı yanlış söylemek]
