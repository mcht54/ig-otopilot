name: Örnek içerik (paylaşmaz)

# Elle çalıştırılır: canlıdakiyle aynı üretim hattı (Gemini/Groq metinleri dahil) ama YAYIN kapalı,
# Instagram/Facebook anahtarı verilmez, durum/ kaydedilmez. Videolar bir ön sürüme (release) yüklenir.
on:
  workflow_dispatch:
    inputs:
      marka:
        description: "Marka kodu (boş = dördü)"
        required: false

permissions:
  contents: write

jobs:
  ornek:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      PYTHONPATH: .
      YAYIN: kapali
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Araçlar
        run: |
          for i in 1 2 3; do  # paket aynası/listesi geçici bozuksa yeniden dene
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg fonts-noto-core fonts-noto-color-emoji >/dev/null && break
            echo "apt denemesi $i başarısız"; sleep 20
          done
          pip install -q -r requirements.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Tarayıcı
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq; python -m playwright install --with-deps chromium && break
            echo "tarayıcı kurulum denemesi $i başarısız"; sleep 20
          done
      - name: Üret (paylaşmadan)
        run: |
          ARGS="--zorla"
          if [ -n "${{ inputs.marka }}" ]; then ARGS="$ARGS --marka ${{ inputs.marka }}"; fi
          python -m otopilot.calistir uret $ARGS || true
      - name: Ön sürüme yükle
        run: |
          mkdir -p dagit
          for d in cikti/*/*/; do
            kod=$(basename "$d")
            for f in reel.mp4 hikaye.mp4 kapak.jpg aciklama.txt senaryo.json; do if [ -f "$d/$f" ]; then cp "$d/$f" "dagit/${kod}-$f"; fi; done
          done
          ls -la dagit
          ETIKET="ornek-$(date +%Y%m%d-%H%M)"
          gh release create "$ETIKET" dagit/* --prerelease --title "Örnek içerik $(date '+%d.%m.%Y %H:%M') (paylaşılmadı)" --notes "Paylaşım kapalı örnek üretim."
