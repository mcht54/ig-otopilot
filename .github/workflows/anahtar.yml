name: Instagram anahtarını yenile

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 09:00 TR (anahtarlar 60 gün geçerli)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yenile:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      IG_API: ${{ vars.IG_API }}
      GH_PAT: ${{ secrets.GH_PAT }}
      IG_SITEMUCIDI_ID: ${{ secrets.IG_SITEMUCIDI_ID }}
      IG_SITEMUCIDI_TOKEN: ${{ secrets.IG_SITEMUCIDI_TOKEN }}
      IG_DAVETIYELER_ID: ${{ secrets.IG_DAVETIYELER_ID }}
      IG_DAVETIYELER_TOKEN: ${{ secrets.IG_DAVETIYELER_TOKEN }}
      IG_SGB_ID: ${{ secrets.IG_SGB_ID }}
      IG_SGB_TOKEN: ${{ secrets.IG_SGB_TOKEN }}
      IG_MARKAKARNEM_ID: ${{ secrets.IG_MARKAKARNEM_ID }}
      IG_MARKAKARNEM_TOKEN: ${{ secrets.IG_MARKAKARNEM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m otopilot.calistir yenile
