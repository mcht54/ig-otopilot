name: Bağlantı kontrolü
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"   # her pazartesi 09:30 TR: Meta anahtarı ve sayfa erişimi hâlâ geçerli mi?
permissions:
  contents: read
  issues: write
jobs:
  kontrol:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      META_SITEMUCIDI_IG_ID: ${{ secrets.META_SITEMUCIDI_IG_ID }}
      META_SITEMUCIDI_PAGE_ID: ${{ secrets.META_SITEMUCIDI_PAGE_ID }}
      META_DAVETIYELER_IG_ID: ${{ secrets.META_DAVETIYELER_IG_ID }}
      META_DAVETIYELER_PAGE_ID: ${{ secrets.META_DAVETIYELER_PAGE_ID }}
      META_SGB_IG_ID: ${{ secrets.META_SGB_IG_ID }}
      META_SGB_PAGE_ID: ${{ secrets.META_SGB_PAGE_ID }}
      META_MARKAKARNEM_IG_ID: ${{ secrets.META_MARKAKARNEM_IG_ID }}
      META_MARKAKARNEM_PAGE_ID: ${{ secrets.META_MARKAKARNEM_PAGE_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: python -m otopilot.calistir kontrol | tee kontrol.txt
      - name: Bağlantı koptuysa bildirim
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Meta bağlantısı koptu; paylaşımlar duracak. Çoğunlukla sistem kullanıcısı anahtarı (IG_TOKEN) yenilenmeli ya da sayfa ataması kaldırılmış."; echo; echo '```'; cat kontrol.txt; echo '```'; } > k.md
          gh issue create --title "⚠️ Instagram/Facebook bağlantısı koptu $(date +%d.%m.%Y)" --body-file k.md
