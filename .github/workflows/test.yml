name: Test
on: [push, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env: { PYTHONPATH: ., TZ: Europe/Istanbul }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip }
      - run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg >/dev/null && pip install -q -r requirements.txt && python -m playwright install --with-deps chromium && break
            sleep 20
          done
      - run: python -m pytest -q tests
