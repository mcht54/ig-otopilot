name: Test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    env: { PYTHONPATH: ., TZ: Europe/Istanbul }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg >/dev/null && pip install -q -r requirements.txt && python -m playwright install --with-deps chromium && break
            sleep 20
          done
      - run: python -m pytest -q tests
