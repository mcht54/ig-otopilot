name: Test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    env: { PYTHONPATH: ., TZ: Europe/Istanbul }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
